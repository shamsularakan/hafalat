name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Acceptance & unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          DAWAT_SECRET: ci-only-secret-not-for-production
      - name: Migrations smoke (fresh DB)
        run: npm run migrate
        env:
          DAWAT_DB_PATH: ./data/ci.db
